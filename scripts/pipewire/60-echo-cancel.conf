# PipeWire echo cancellation (WebRTC AEC) for speech barge-in.
#
# Install:
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp scripts/pipewire/60-echo-cancel.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire pipewire-pulse wireplumber
#
# This creates a virtual mic "ec_source" (your mic with the speaker output
# subtracted) and a virtual speaker "ec_sink". Make them the defaults:
#   pactl set-default-source ec_source
#   pactl set-default-sink ec_sink
# ...or leave your defaults alone and point only the listener and the TTS at them
# (audio.device in the config, and e.g. `PULSE_SINK=ec_sink` / `pw-play --target ec_sink`
# for the TTS player).
#
# The key requirement: the agent's TTS must play through ec_sink, because that
# is the reference signal the canceller subtracts from the mic.

context.modules = [
  {   name = libpipewire-module-echo-cancel
      args = {
          library.name = aec/libspa-aec-webrtc
          capture.props = {
             node.name = "ec_capture"
          }
          source.props = {
             node.name = "ec_source"
             node.description = "Echo-cancelled microphone"
          }
          sink.props = {
             node.name = "ec_sink"
             node.description = "Echo-cancel speaker"
          }
          playback.props = {
             node.name = "ec_playback"
          }
      }
  }
]
