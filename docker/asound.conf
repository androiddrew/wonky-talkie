# Route ALSA's default device to PulseAudio. The container has no sound card of
# its own: PortAudio opens ALSA "default", this sends it to the pulse plugin, and
# PULSE_SERVER (set at `docker run`) points that at the host's socket. PipeWire
# serves the same socket, so this works on PipeWire desktops as well.
pcm.!default { type pulse }
ctl.!default { type pulse }
