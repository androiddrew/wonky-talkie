# Desktop with an RTX 4090: everything local, faster-whisper in-process on the GPU.
# Every key is optional; see wonky_talkie/config.py for all defaults.

[audio]
device = "7"            # "" = system default input
sample_rate = 0        # 0 = 48 kHz (or 16 kHz) duplex if the devices allow
playback = true        # wonky-talkie owns the speaker (needed for echo-proof barge-in)
output_device = ""     # "" = system default output
output_channels = 1

[aec]
enabled = true         # needs libspeexdsp1
filter_ms = 250

[wake]
models = ["hey_jarvis"]
threshold = 0.5
strip_phrases = ["hey jarvis", "jarvis"]

[vad]
threshold = 0.5
end_silence_ms = 800   # pause that ends a turn; 600 is snappier, 1000 more patient

[session]
after_wake_timeout_s = 5.0
followup_timeout_s = 8.0
max_utterance_s = 20.0

[barge_in]
enabled = true
triggers = ["speech", "wake_word"]
vad_threshold = 0.6
min_speech_ms = 300
grace_ms = 250
verify = true                        # duck-and-verify (needs our own playback)
verify_min_excess_db = 6.0

[stt]
backend = "faster_whisper"
language = "en"
partials = true                     # cheap on a 4090
partial_interval_ms = 500

[stt.faster_whisper]
model = "large-v3-turbo"
device = "cuda"
compute_type = "float16"
beam_size = 5
hotwords = ""                        # e.g. "Jarvis Kubernetes Grafana"

[tts]
# wonky-talkie speaks: the agent sends `say` with text and we synthesize it.
# kitten | piper | command | openai | none ("none" = agents must send `play`)
backend = "kitten"
first_chunk_chars = 48               # this IS your reply latency: kitten costs ~0.07 s/char here,
                                     # so 48 chars is ~1 s before the first word is audible
max_chars = 320
warmup = true

[tts.kitten]
model = "KittenML/kitten-tts-mini-0.8"   # micro-0.8 / nano-0.8 / nano-0.8-int8 are smaller
# Bella=expr-voice-2-f  Jasper=expr-voice-2-m  Luna=expr-voice-3-f  Bruno=expr-voice-3-m
# Rosie=expr-voice-4-f  Hugo=expr-voice-4-m     Kiki=expr-voice-5-f  Leo=expr-voice-5-m
voice = "expr-voice-4-m"                 # = Leo. Either spelling works.
speed = 1.2                              # 0.8 slower / 1.2 faster

# No-dependency fallback if KittenTTS won't install (e.g. on Python 3.13):
# [tts]
# backend = "command"
# [tts.command]
# command = "espeak-ng --stdout"

[server]
host = "127.0.0.1"                   # 0.0.0.0 to accept agents from other machines (set a token)
port = 8765
token = ""

[debug]
save_audio_dir = ""                  # e.g. "captures" to keep every utterance as WAV
log_level = "INFO"
