# Jetson Orin on JetPack 7.2 (Ubuntu 24.04, Python 3.12, CUDA 13).
# Wake word + VAD run on the CPU via onnxruntime; transcription goes to a
# whisper.cpp server built with CUDA on the same board (see README: Jetson).

[audio]
device = ""            # a USB speakerphone / mic array that is also the output works best
sample_rate = 0
playback = true        # wonky-talkie owns the speaker (needed for echo-proof barge-in)
output_device = ""     # e.g. the mic array's own output, so they share a clock
output_channels = 1

[aec]
enabled = true         # needs libspeexdsp1
filter_ms = 250

[wake]
models = ["hey_jarvis"]
threshold = 0.5
strip_phrases = ["hey jarvis", "jarvis"]

[vad]
threshold = 0.5
end_silence_ms = 800

[session]
after_wake_timeout_s = 5.0
followup_timeout_s = 8.0
max_utterance_s = 20.0

[barge_in]
enabled = true
triggers = ["speech", "wake_word"]
vad_threshold = 0.6
min_speech_ms = 300
grace_ms = 300
verify = true                        # duck-and-verify (needs our own playback)
verify_min_excess_db = 6.0

[stt]
backend = "whisper_cpp"
language = "en"
partials = false        # turn on once you've measured STT latency on your board

[stt.http]
url = "http://127.0.0.1:8080/inference"
flavor = "whisper_cpp"
timeout_s = 30

# Alternative: send audio to the desktop instead (Jetson as a "satellite").
# Run an OpenAI-compatible Whisper server there (e.g. speaches) and use:
# [stt]
# backend = "openai"
# [stt.http]
# url = "http://desktop.local:8000/v1/audio/transcriptions"
# flavor = "openai"
# model = "Systran/faster-whisper-large-v3"

[tts]
# KittenTTS is CPU-only and small, so it costs the Orin almost nothing and
# leaves the GPU to whisper.cpp.
backend = "kitten"
first_chunk_chars = 100              # a little shorter: the Orin synthesizes slower
max_chars = 280
warmup = true

[tts.kitten]
model = "KittenML/kitten-tts-nano-0.8"   # 56 MB; mini-0.8 sounds better if you have room
voice = "expr-voice-5-m"
speed = 1.0

# Alternative: borrow the desktop's voice (Jetson as a "satellite"), matching
# the [stt] openai option below.
# [tts]
# backend = "openai"
# [tts.http]
# url = "http://desktop.local:8880/v1/audio/speech"
# voice = "alloy"

[server]
host = "127.0.0.1"
port = 8765

[debug]
log_level = "INFO"
