[project]
name = "wonky-talkie"
version = "0.1.0"
description = "Think of it as a walkie talkie for a agent. A service that allows an agent to listen and verbally respond to a user."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "websockets>=13",
  "sounddevice",
  "scikit-learn",
  "tqdm",
  "requests",
]

[project.optional-dependencies]
# Pick exactly one of cpu / gpu: they install into the same onnxruntime/ dir.
# faster-whisper (desktop) depends on the CPU onnxruntime, so a gpu install also
# needs `make onnx-runtime PROFILE=gpu` afterwards; `make setup-gpu` does it all.
cpu = ["onnxruntime"]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.26,<1.27", "nvidia-cublas-cu12"]
desktop = ["faster-whisper>=1.1"]
# KittenTTS is a direct wheel reference. `spacy<4` matters: without it pip
# backtracks to spacy 4.0.0.dev3 -> thinc 9 -> blis, which has no 3.13 wheel.
# misaki 0.9.4's published metadata also still says python <3.13, so it needs
# --ignore-requires-python; see README. The other TTS backends have no Python deps.
kitten = [
  "kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl",
  "spacy<4",
  "soundfile",
]

[project.scripts]
wonky-talkie = "wonky_talkie.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wonky_talkie"]
